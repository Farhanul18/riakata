# ==========================================================
# netlify.toml — pengaturan deploy Riakata
# Redirect status 200 = "rewrite": alamat di browser tetap cantik,
# isinya diambil dari file HTML. JavaScript membaca slug dari alamat.
# ==========================================================
[build]
  publish = "."

# ---------- URL cantik halaman publik ----------
[[redirects]]
  from = "/artikel/*"
  to = "/artikel.html"
  status = 200

[[redirects]]
  from = "/kategori/*"
  to = "/kategori.html"
  status = 200

[[redirects]]
  from = "/tag/*"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/terkini"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/terpopuler"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/pilihan-editor"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/penulis/*"
  to = "/penulis.html"
  status = 200

# ---------- Header keamanan ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Area kerja dan login tidak boleh masuk hasil pencarian Google
[[headers]]
  for = "/jurnalis/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/redaksi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"