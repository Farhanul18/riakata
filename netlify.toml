# ==========================================================
# netlify.toml — pengaturan deploy Riakata
# Redirect status 200 = "rewrite": alamat di browser tetap cantik,
# isinya diambil dari file HTML. JavaScript membaca slug dari alamat.
# ==========================================================
[build]
  publish = "."

# Kode server (butuh package.json di root dan Environment Variables di Netlify)
[functions]
  directory = "netlify/functions"

# ---------- URL cantik halaman publik ----------
# Halaman artikel melewati function supaya meta tag (pratinjau WhatsApp/IG/Google) terisi
[[redirects]]
  from = "/artikel/*"
  to = "/.netlify/functions/og-artikel"
  status = 200

[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/kategori/*"
  to = "/kategori.html"
  status = 200

[[redirects]]
  from = "/tag/*"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/terkini"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/terpopuler"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/pilihan-editor"
  to = "/daftar.html"
  status = 200

[[redirects]]
  from = "/penulis/*"
  to = "/penulis.html"
  status = 200

# ---------- Header keamanan ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Area kerja dan login tidak boleh masuk hasil pencarian Google
[[headers]]
  for = "/jurnalis/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/redaksi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------- Cache ----------
# Berkas statis tidak diberi nama unik, jadi cukup disimpan singkat lalu divalidasi ulang.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------- Content Security Policy (MODE LAPOR SAJA) ----------
# "Report-Only" tidak memblokir apa pun; pelanggaran hanya tampil di Console browser.
# Cek Console di setiap halaman. Kalau bersih, ubah nama header menjadi
# "Content-Security-Policy" supaya benar-benar diberlakukan.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://*.googleapis.com https://api.cloudinary.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"