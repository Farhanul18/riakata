<!DOCTYPE html>
<html lang="id" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriber — Riakata</title>
  <meta name="robots" content="noindex, nofollow">
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="app__sidebar">
    <a class="app__logo" href="/" aria-label="Riakata, ke beranda"><img src="/assets/logo/riakata-logo-light.svg" alt="Riakata" width="140" height="36"></a>
    <nav class="app__nav" aria-label="Menu redaksi">
      <a href="/redaksi/dashboard.html">Dashboard</a>
      <a href="/redaksi/artikel.html">Semua Artikel</a>
      <a href="/redaksi/kategori.html">Kategori dan Topik</a>
      <a href="/redaksi/pengguna.html">Pengguna</a>
      <a href="/redaksi/subscriber.html" aria-current="page">Subscriber</a>
      <a href="/" target="_blank" rel="noopener">Lihat Situs</a>
    </nav>
    <div class="app__user">
      <p><span class="app__user-name" data-user-name></span><br><span class="app__user-role" data-user-role></span></p>
      <button class="btn btn--outline btn--on-dark btn--sm" type="button" data-logout>Keluar</button>
    </div>
  </aside>

  <main class="app__main" id="konten">
    <div class="page-head">
      <div>
        <h1 class="page-head__title">Subscriber Newsletter</h1>
        <p class="page-head__sub" id="sub-count">Memuat...</p>
      </div>
      <div class="action-buttons">
        <button class="btn btn--outline" type="button" id="copy-btn">Salin semua email</button>
        <button class="btn btn--primary" type="button" id="csv-btn">Unduh CSV</button>
      </div>
    </div>
    <div class="toolbar"><label class="sr-only" for="search">Cari email</label><input class="input" id="search" type="search" placeholder="Cari email..."></div>
    <div class="work-list" id="sub-list" aria-live="polite"><div class="skeleton" style="height:3.5rem"></div><div class="skeleton" style="height:3.5rem"></div></div>
  </main>
</div>
<script type="module" src="/assets/js/fb-redaksi-subscriber.js"></script>
</body>
</html>
