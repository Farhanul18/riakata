<!DOCTYPE html>
<html lang="id" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Artikel — Riakata</title>
  <meta name="robots" content="noindex, nofollow">
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="app__sidebar">
    <a class="app__logo" href="/" aria-label="Riakata, ke beranda"><img src="/assets/logo/riakata-logo-light.svg" alt="Riakata" width="140" height="36"></a>
    <nav class="app__nav" aria-label="Menu redaksi">
      <a href="/redaksi/dashboard.html">Dashboard</a>
      <a href="/redaksi/artikel.html">Semua Artikel</a>
      <a href="/" target="_blank" rel="noopener">Lihat Situs</a>
    </nav>
    <div class="app__user">
      <p><span class="app__user-name" data-user-name></span><br><span class="app__user-role" data-user-role></span></p>
      <button class="btn btn--outline btn--on-dark btn--sm" type="button" data-logout>Keluar</button>
    </div>
  </aside>

  <main class="app__main" id="konten">
    <div class="page-head">
      <div>
        <h1 class="page-head__title">Review Artikel</h1>
        <p class="page-head__sub">Baca, beri catatan, lalu putuskan: setujui, minta revisi, tolak, atau terbitkan.</p>
      </div>
      <a class="btn btn--outline" href="/redaksi/artikel.html">Kembali ke daftar</a>
    </div>
    <div id="review-notice" role="alert" hidden style="margin-bottom:var(--space-5)"></div>

    <div class="review-layout" id="review-layout">
      <article class="preview" id="preview" aria-live="polite">
        <div class="skeleton" style="height:16rem"></div>
        <div class="skeleton" style="height:2rem;margin-top:1rem;width:70%"></div>
        <div class="skeleton" style="height:10rem;margin-top:1rem"></div>
      </article>

      <aside class="review-side" aria-label="Tindakan dan informasi">
        <section class="box" id="action-box" aria-labelledby="judul-tindakan">
          <h2 class="box__title" id="judul-tindakan">Keputusan editor</h2>
          <div id="action-body"></div>
        </section>
        <section class="box" aria-labelledby="judul-info">
          <h2 class="box__title" id="judul-info">Informasi</h2>
          <dl class="meta-list" id="info"></dl>
        </section>
        <section class="box" aria-labelledby="judul-riwayat">
          <h2 class="box__title" id="judul-riwayat">Riwayat</h2>
          <ol class="history" id="history"><li class="text-muted">Memuat...</li></ol>
        </section>
      </aside>
    </div>
  </main>
</div>
<script type="module" src="/assets/js/fb-redaksi-review.js"></script>
</body>
</html>
