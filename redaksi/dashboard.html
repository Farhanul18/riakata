<!DOCTYPE html>
<html lang="id" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Redaksi — Riakata</title>
  <meta name="robots" content="noindex, nofollow">
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="app__sidebar">
    <a class="app__logo" href="/" aria-label="Riakata, ke beranda"><img src="/assets/logo/riakata-logo-light.svg" alt="Riakata" width="140" height="36"></a>
    <nav class="app__nav" aria-label="Menu redaksi">
      <a href="/redaksi/dashboard.html" aria-current="page">Dashboard</a>
      <a href="/redaksi/artikel.html">Semua Artikel</a>
      <a href="/redaksi/kategori.html">Kategori dan Topik</a>
      <a href="/redaksi/pengguna.html">Pengguna</a>
      <a href="/redaksi/subscriber.html">Subscriber</a>
      <a href="/" target="_blank" rel="noopener">Lihat Situs</a>
    </nav>
    <div class="app__user">
      <p><span class="app__user-name" data-user-name></span><br><span class="app__user-role" data-user-role></span></p>
      <button class="btn btn--outline btn--on-dark btn--sm" type="button" data-logout>Keluar</button>
    </div>
  </aside>

  <main class="app__main" id="konten">
    <div class="page-head">
      <div>
        <h1 class="page-head__title">Dashboard Redaksi</h1>
        <p class="page-head__sub">Antrean review, artikel siap terbit, dan ringkasan situs.</p>
      </div>
      <a class="btn btn--outline" href="/redaksi/artikel.html">Kelola semua artikel</a>
    </div>
    <div class="stats" id="stats" aria-label="Ringkasan"></div>

    <h2 class="section-title" style="margin-bottom:var(--space-4)">Antrean review</h2>
    <div class="work-list" id="queue-list" aria-live="polite">
      <div class="skeleton" style="height:5rem"></div><div class="skeleton" style="height:5rem"></div>
    </div>

    <div class="section-gap">
      <h2 class="section-title" style="margin-bottom:var(--space-4)">Usulan isu masuk</h2>
      <div class="work-list" id="issues-list" aria-live="polite"></div>
    </div>

    <div class="section-gap">
      <h2 class="section-title" style="margin-bottom:var(--space-4)">Siap terbit</h2>
      <div class="work-list" id="approved-list"></div>
    </div>

    <div class="section-gap">
      <h2 class="section-title" style="margin-bottom:var(--space-4)">Baru diterbitkan</h2>
      <div class="work-list" id="published-list"></div>
    </div>
  </main>
</div>
<script type="module" src="/assets/js/fb-redaksi-dashboard.js"></script>
</body>
</html>
